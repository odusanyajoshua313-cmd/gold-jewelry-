<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Goldplugdami inventory</title><style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;background:#f5f0e7;color:#173f3d}input,select,textarea,button{font:inherit;padding:.55rem}fieldset{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem;border:1px solid #9a8770;margin:1rem 0;padding:1rem}label{display:grid;gap:.3rem;font-size:.85rem}button{background:#175e59;color:#fff;border:0;border-radius:4px;cursor:pointer}.panel{background:#fff;padding:1rem;margin:1rem 0;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:.55rem;text-align:left;border-bottom:1px solid #ddd}.error{color:#9b2c2c}.sold{color:#9b2c2c;font-weight:700}</style></head><body><h1>Goldplugdami inventory</h1><p>Owner-only tool. Set <code>ADMIN_TOKEN</code> on the server, then use that token below. It is kept only for this browser session.</p><section class="panel"><label>Admin token<input id="token" type="password" autocomplete="current-password"></label><button id="load">Load inventory</button><p id="status" role="status"></p></section><section id="workspace" hidden><section class="panel"><h2>Add product</h2><form id="product-form"><fieldset><label>SKU<input name="sku" required></label><label>Name<input name="name" required></label><label>Category<input name="category" required placeholder="necklaces"></label><label>Karat<select name="karat"><option>18</option><option>21</option><option>22</option><option>24</option></select></label><label>Weight (g)<input name="weightGrams" type="number" min=".01" step=".01" required></label><label>Stock quantity<input name="stockQuantity" type="number" min="0" step="1" required></label><label>Quote state<select name="quoteState"><option value="daily-rate">Daily rate</option><option value="request-quote">Request quote</option></select></label><label>Status<select name="status"><option value="active">Active</option><option value="draft">Draft</option><option value="archived">Archived</option></select></label><label>Image path<input name="image" required placeholder="assets/example.png"></label><label>Image alt text<input name="alt" required></label><label>Detail<input name="detail"></label></fieldset><button>Add product</button></form></section><section class="panel"><h2>Record sale</h2><form id="sale-form"><fieldset><label>Product<select id="sale-sku" name="sku"></select></label><label>Quantity<input name="quantity" type="number" min="1" value="1" required></label><label>Channel<select name="channel"><option value="whatsapp">WhatsApp</option><option value="walk-in">Walk-in</option><option value="delivery">Delivery</option></select></label><label>Reference<input name="reference" placeholder="Receipt/order no."></label><label>Notes<textarea name="notes"></textarea></label></fieldset><button>Record sale and reduce stock</button></form></section><section class="panel"><h2>Catalogue</h2><table><thead><tr><th>SKU</th><th>Product</th><th>Stock</th><th>Status</th><th>Save</th></tr></thead><tbody id="products"></tbody></table></section><section class="panel"><h2>Recent sales</h2><div id="sales"></div></section></section><script src="admin.js"></script></body></html>
